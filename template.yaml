AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Infraestructura AWS SAM - Portal de Notas con Dashboard Lambda

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs18.x

Resources:
  # 1. Función AWS Lambda para el Dashboard
  DashboardMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Environment:
        Variables:
          BACKEND_HOST: "backend"
      Events:
        GetMetrics:
          Type: Api
          Properties:
            Path: /metrics
            Method: get

  # 2. Bucket S3 para Frontend Estático
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "fixlat-frontend-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # 3. Distribución CloudFront para el Frontend
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: allow-all
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false

  # 4. Instancia EC2 para la API (Docker)
  BackendEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c101bfb1146432cf # Amazon Linux 2 (o AMI según región)
      SecurityGroups:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          amazon-linux-extras install docker -y
          service docker start
          usermod -a -G docker ec2-user

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permitir trafico HTTP y SSH para la API
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

Outputs:
  MetricsApiUrl:
    Description: URL local/remota de la API Lambda para las métricas
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/metrics"
  CloudFrontURL:
    Description: URL de distribución CloudFront
    Value: !GetAtt CloudFrontDistribution.DomainName