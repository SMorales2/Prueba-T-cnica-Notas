services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixlat_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
    networks:
      - fixlat-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixlat_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fixlat-net

  lambda:
    build:
      context: ./lambda
      dockerfile: Dockerfile
    container_name: fixlat_lambda
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./lambda:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend
    networks:
      - fixlat-net

networks:
  fixlat-net:
    driver: bridge